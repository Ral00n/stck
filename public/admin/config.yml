# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Ral00n/stck
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/aabdfc0b-8bae-4e85-bdf5-39bdc1336c78/pkce
  auth_token_endpoint: /sites/aabdfc0b-8bae-4e85-bdf5-39bdc1336c78/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://lively-queijadas-4088f2.netlify.app

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "news"
    label: "News Posts"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Site News", "Research", "Workouts", "Supplements"]
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "text" }
  - name: "products"
    label: "Products (Compare Tab)"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Brand", name: "brand", widget: "string" }
      - { label: "Product Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Whey Protein", value: "protein" }
          - { label: "Creatine", value: "creatine" }
          - { label: "Omega-3 / Fish Oil", value: "omega3" }
          - { label: "Vitamin D3", value: "vitaminD" }
          - { label: "Magnesium", value: "magnesium" }
          - { label: "Ashwagandha", value: "ashwagandha" }
          - { label: "Melatonin", value: "melatonin" }
          - { label: "Collagen", value: "collagen" }
          - { label: "Multivitamin", value: "multivitamin" }
      - { label: "Product Photo", name: "image", widget: "image", required: false }
      - label: "Specs (rows shown in the comparison table)"
        name: "specs"
        widget: "list"
        fields:
          - { label: "Row Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
      - { label: "Certifications", name: "certifications", widget: "string", required: false }
      - { label: "Price per Serving", name: "pricePerServing", widget: "string" }
      - { label: "Source URL (where you found the info)", name: "sourceUrl", widget: "string", required: false }
